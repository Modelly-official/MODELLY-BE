plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'modelly'
version = '0.0.1-SNAPSHOT'
description = 'Modelly Project'
def queryDslVersion = "6.11"


java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	//Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'

	// health 체크용 actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	//Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// SMS(Solapi API)
	implementation 'com.solapi:sdk:1.0.3'

	// EMAIL
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// WebSocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	//QueryDSL
	implementation("io.github.openfeign.querydsl:querydsl-core:${queryDslVersion}")
	implementation("io.github.openfeign.querydsl:querydsl-jpa:$queryDslVersion")
	annotationProcessor("io.github.openfeign.querydsl:querydsl-apt:$queryDslVersion:jpa")

	//google geocoding
	implementation group: 'com.google.maps', name: 'google-maps-services', version: '2.2.0'

	// Spring batch
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	// S3
	implementation 'software.amazon.awssdk:s3:2.39.5'

	//Retry
	implementation 'org.springframework.retry:spring-retry'

	//AOP
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	//firebase
	implementation 'com.google.firebase:firebase-admin:9.2.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
