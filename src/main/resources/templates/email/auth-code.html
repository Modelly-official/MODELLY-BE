<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Modelly 이메일 인증</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;
             font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
<div style="max-width:600px;margin:40px auto;background-color:#ffffff;
            border-radius:8px;overflow:hidden;border:1px solid #e5e5e5;">
    <div style="background-color:#8bc9fe;padding:20px 24px;">
        <h1 style="margin:0;font-size:22px;color:#ffffff;">이메일 인증</h1>
    </div>

    <div style="padding:32px 24px;text-align:center;">
        <p style="font-size:18px;font-weight:600;margin-bottom:12px;"
           th:text="${mainTitle}">
            회원가입을 해 주셔서 감사합니다.
        </p>
        <p style="font-size:14px;color:#555;margin:0 0 24px;"
           th:text="${subText}">
            아래 인증번호를 입력하면<br>
            Modelly 서비스를 정상적으로 이용하실 수 있습니다.
        </p>

        <div style="display:inline-block;padding:12px 24px;margin-bottom:24px;
                    border:1px solid #8bc9fe;border-radius:6px;">
            <span style="font-size:22px;font-weight:700;letter-spacing:4px;color:#8bc9fe;"
                  th:text="${code}">123456</span>
        </div>

        <p style="font-size:12px;color:#999;margin:0;">
            인증번호 유효시간은 <span th:text="${expireMinutes}">5</span>분입니다.
        </p>
    </div>

    <div style="padding:16px 24px;border-top:1px solid #eee;text-align:center;">
        <p style="font-size:11px;color:#aaa;margin:0;">
            본 메일은 발신 전용입니다. 문의는 고객센터를 이용해주세요.
        </p>
    </div>
</div>
</body>
</html>
