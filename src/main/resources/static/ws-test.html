<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SockJS + STOMP + JWT 테스트</title>

    <!-- SockJS & stomp.js (2.x) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body { font-family: sans-serif; margin: 24px; }
        input { padding: 6px; margin: 4px 0; width: 420px; }
        button { padding: 6px 12px; margin: 4px 2px; }
        #log {
            border: 1px solid #ccc;
            height: 320px;
            padding: 8px;
            white-space: pre-wrap;
            overflow-y: auto;
            margin-top: 10px;
            background: #f5f5f5;
        }
    </style>
</head>
<body>

<h2>SockJS STOMP + JWT 테스트</h2>

<p><b>1. JWT Access Token (Bearer 빼고 값만)</b></p>
<input id="jwt" placeholder="eyJhbGciOiJIUzI1NiJ9....">

<p><b>2. 방 ID</b></p>
<input id="roomId" value="1">

<p><b>텍스트 메시지 내용</b></p>
<input id="message" value="SockJS + JWT 테스트입니다">

<p><b>이미지 파일 (여러 장 선택 가능)</b></p>
<input id="images" type="file" accept="image/*" multiple>

<p><b>읽음 처리할 마지막 메시지 ID</b></p>
<input id="lastReadMessageId" value="0">

<br>
<button id="connectBtn">CONNECT</button>
<button id="disconnectBtn" disabled>DISCONNECT</button>
<button id="subscribeBtn" disabled>SUBSCRIBE</button>
<button id="sendBtn" disabled>SEND TEXT MESSAGE</button>
<button id="sendImageBtn" disabled>SEND IMAGE MESSAGE</button>
<button id="sendReadBtn" disabled>SEND READ EVENT</button>

<h3>로그</h3>
<div id="log"></div>

<script>
    let stompClient = null;

    function log(msg) {
        const el = document.getElementById('log');
        el.textContent += msg + "\n";
        el.scrollTop = el.scrollHeight;
        console.log(msg);
    }

    // ---------- CONNECT ----------
    document.getElementById('connectBtn').onclick = () => {
        const token = document.getElementById('jwt').value.trim();

        // ★ SockJS 엔드포인트: context-path 포함해서 http URL
        const socket = new SockJS('http://localhost:8080/api/ws/chat');
        stompClient = Stomp.over(socket);

        log('🔌 Connecting...');

        stompClient.connect(
            token ? { Authorization: 'Bearer ' + token } : {},
            frame => {
                log('✅ CONNECTED');
                log(JSON.stringify(frame.headers));
                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('subscribeBtn').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('sendImageBtn').disabled = false;
                document.getElementById('sendReadBtn').disabled = false;
            },
            error => {
                log('❌ CONNECTION ERROR');
                log(error);
            }
        );
    };

    // ---------- DISCONNECT ----------
    document.getElementById('disconnectBtn').onclick = () => {
        if (stompClient) {
            stompClient.disconnect(() => {
                log('🔌 DISCONNECTED');
            });
        }
        document.getElementById('disconnectBtn').disabled = true;
        document.getElementById('subscribeBtn').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('sendImageBtn').disabled = true;
        document.getElementById('sendReadBtn').disabled = true;
    };

    // ---------- SUBSCRIBE ----------
    document.getElementById('subscribeBtn').onclick = () => {
        if (!stompClient) {
            return log('⚠️ 아직 CONNECT 안 됨');
        }
        const roomId = document.getElementById('roomId').value.trim();
        const dest = '/sub/chat/rooms/' + roomId;

        log('📡 SUBSCRIBE ' + dest);

        stompClient.subscribe(dest, (message) => {
            try {
                const body = JSON.parse(message.body);
                const type = body.messageType; // TEXT / IMAGE / READ

                if (type === 'READ') {
                    log('📥 [READ EVENT] ' + message.body);
                } else {
                    log('📥 [CHAT MESSAGE] ' + message.body);
                }
            } catch (e) {
                log('📥 [RAW] ' + message.body);
            }
        });
    };

    document.getElementById('sendBtn').onclick = () => {
        if (!stompClient) {
            return log('⚠️ 아직 CONNECT 안 됨');
        }
        const roomId = document.getElementById('roomId').value.trim();
        const dest = '/pub/chat/rooms/' + roomId;
        const msg = document.getElementById('message').value;

        const payload = JSON.stringify({
            messageType: 'TEXT',
            message: msg
        });

        log('📤 SEND TEXT to ' + dest + ': ' + payload);

        stompClient.send(dest, { 'content-type': 'application/json' }, payload);
    };

    // ---------- SEND IMAGE MESSAGE ----------
    document.getElementById('sendImageBtn').onclick = async () => {
        if (!stompClient) {
            return log('⚠️ 아직 CONNECT 안 됨');
        }

        const filesInput = document.getElementById('images');
        const files = filesInput.files;
        if (!files || files.length === 0) {
            return log('⚠️ 선택된 이미지가 없음');
        }

        const token = document.getElementById('jwt').value.trim();
        const roomId = document.getElementById('roomId').value.trim();
        const dest = '/pub/chat/rooms/' + roomId;

        try {
            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }

            const uploadUrl = 'http://localhost:8080/api/chat/rooms/' + roomId + '/images';

            log('⬆️ 업로드 요청: POST ' + uploadUrl + ' (' + files.length + ' files)');

            const headers = {};
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }

            const res = await fetch(uploadUrl, {
                method: 'POST',
                headers,
                body: formData
            });

            if (!res.ok) {
                log('❌ 이미지 업로드 실패: HTTP ' + res.status);
                return;
            }

            const resJson = await res.json();
            const imageUrls = resJson.result;

            log('✅ 업로드 성공, imageUrls = ' + JSON.stringify(imageUrls));

            if (!imageUrls || imageUrls.length === 0) {
                log('⚠️ 서버 응답에 imageUrls 없음');
                return;
            }

            const payload = JSON.stringify({
                messageType: 'IMAGE',
                imageUrls: imageUrls
            });

            log('📤 SEND IMAGE to ' + dest + ': ' + payload);

            stompClient.send(dest, { 'content-type': 'application/json' }, payload);

        } catch (e) {
            console.error(e);
            log('❌ 이미지 업로드/전송 중 에러: ' + e);
        }
    };

    // ---------- SEND READ EVENT ----------
    document.getElementById('sendReadBtn').onclick = () => {
        if (!stompClient) {
            return log('⚠️ 아직 CONNECT 안 됨');
        }

        const roomId = document.getElementById('roomId').value.trim();
        const lastReadIdStr = document.getElementById('lastReadMessageId').value.trim();
        const lastReadId = Number(lastReadIdStr);

        if (!lastReadIdStr || Number.isNaN(lastReadId)) {
            return log('⚠️ lastReadMessageId가 올바르지 않음');
        }

        const dest = '/pub/chat/rooms/' + roomId + '/read';

        const payload = JSON.stringify({
            lastMessageId: lastReadId   // 서버에서 이 기준으로 READ 처리 + READ 이벤트 쏴줌
        });

        log('📤 SEND READ EVENT to ' + dest + ': ' + payload);

        stompClient.send(dest, { 'content-type': 'application/json' }, payload);
    };
</script>

</body>
</html>
