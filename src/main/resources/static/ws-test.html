<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SockJS + STOMP + JWT 테스트</title>

    <!-- SockJS & stomp.js (2.x) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body { font-family: sans-serif; margin: 24px; }
        input { padding: 6px; margin: 4px 0; width: 420px; }
        button { padding: 6px 12px; margin: 4px 2px; }
        #log {
            border: 1px solid #ccc;
            height: 280px;
            padding: 8px;
            white-space: pre-wrap;
            overflow-y: auto;
            margin-top: 10px;
            background: #f5f5f5;
        }
    </style>
</head>
<body>

<h2>SockJS STOMP + JWT 테스트</h2>

<p><b>1. JWT Access Token (Bearer 빼고 값만)</b></p>
<input id="jwt" placeholder="eyJhbGciOiJIUzI1NiJ9....">

<p><b>2. 방 ID</b></p>
<input id="roomId" value="1">

<p><b>메시지 내용</b></p>
<input id="message" value="SockJS + JWT 테스트입니다">

<br>
<button id="connectBtn">CONNECT</button>
<button id="disconnectBtn" disabled>DISCONNECT</button>
<button id="subscribeBtn" disabled>SUBSCRIBE</button>
<button id="sendBtn" disabled>SEND MESSAGE</button>

<h3>로그</h3>
<div id="log"></div>

<script>
    let stompClient = null;

    function log(msg) {
        const el = document.getElementById('log');
        el.textContent += msg + "\n";
        el.scrollTop = el.scrollHeight;
        console.log(msg);
    }

    document.getElementById('connectBtn').onclick = () => {
        const token = document.getElementById('jwt').value.trim();

        // ★ SockJS 엔드포인트: context-path 포함해서 http URL
        const socket = new SockJS('http://localhost:8080/api/ws/chat');
        stompClient = Stomp.over(socket);

        log('🔌 Connecting...');

        stompClient.connect(
            token ? { Authorization: 'Bearer ' + token } : {},
            frame => {
                log('✅ CONNECTED');
                log(JSON.stringify(frame.headers));
                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('subscribeBtn').disabled = false;
                document.getElementById('sendBtn').disabled = false;
            },
            error => {
                log('❌ CONNECTION ERROR');
                log(error);
            }
        );
    };

    document.getElementById('disconnectBtn').onclick = () => {
        if (stompClient) {
            stompClient.disconnect(() => {
                log('🔌 DISCONNECTED');
            });
        }
        document.getElementById('disconnectBtn').disabled = true;
        document.getElementById('subscribeBtn').disabled = true;
        document.getElementById('sendBtn').disabled = true;
    };

    document.getElementById('subscribeBtn').onclick = () => {
        if (!stompClient) {
            return log('⚠️ 아직 CONNECT 안 됨');
        }
        const roomId = document.getElementById('roomId').value.trim();
        const dest = '/sub/chat/rooms/' + roomId;

        log('📡 SUBSCRIBE ' + dest);

        stompClient.subscribe(dest, (message) => {
            log('📥 RECEIVED from ' + dest + ': ' + message.body);
        });
    };

    document.getElementById('sendBtn').onclick = () => {
        if (!stompClient) {
            return log('⚠️ 아직 CONNECT 안 됨');
        }
        const roomId = document.getElementById('roomId').value.trim();
        const dest = '/pub/chat/rooms/' + roomId;
        const msg = document.getElementById('message').value;

        const payload = JSON.stringify({ message: msg });

        log('📤 SEND to ' + dest + ': ' + payload);

        stompClient.send(dest, { 'content-type': 'application/json' }, payload);
    };
</script>

</body>
</html>
